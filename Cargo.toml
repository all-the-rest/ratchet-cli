[package]
name = "ratchet"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
description = "Ratchet gates: a count compared against a baseline that may only move in one declared direction."
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "ratchet"
path = "src/lib.rs"

[[bin]]
name = "ratchet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The self-update needs an HTTPS client and a SHA-256 implementation.  The
# client is ureq with rustls: no OpenSSL, no system TLS, one static-ish
# binary.  The hash is the RustCrypto implementation of SHA-256.
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
# ReFS can require the full 128-bit file ID to distinguish directories.
file-id = "0.2.3"
