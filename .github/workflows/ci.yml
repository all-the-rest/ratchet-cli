name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # The update check asks the release API for the newest version.  The CI
      # stays hermetic: it does not depend on the network, and a network
      # problem can never turn a green run red.
      RATCHET_NO_UPDATE_CHECK: "1"

    steps:
      - name: Checkout
        # The checkout is **pinned**: a moving label can change the code that
        # checks the repository out under the run. The same SHA is used by the
        # release and by the workflow that moves the action tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node.js
        # The JavaScript config is evaluated by node; without it the eight
        # node-gated tests would skip silently.
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test

      - name: "Self-gate: ratchet check"
        if: runner.os != 'Windows'
        # The repository gates itself with the binary it ships: the rules are
        # in ratchet.config.jsonc, the counters in scripts/count.sh, the
        # baselines in ratchet.baseline.json.  The binary has to exist before
        # the gate runs.
        run: |
          cargo build
          ./target/debug/ratchet check

      - name: "Self-gate: ratchet check (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        # Keep the explicit binary self-gate on Windows as well; cargo build
        # produces an .exe there.
        run: |
          cargo build
          .\target\debug\ratchet.exe check
